options:
  substitutionOption: ALLOW_LOOSE
substitutions:
  _NODE_VERSION: "18"
  _NAMESPACE: gcr.io

steps:

  - id: BUILD-IMAGE
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -eo pipefail
        safeTag="${BRANCH_NAME}"
        safeTag="$${safeTag//\//_}"
        docker buildx build . \
          --push \
          --build-arg NODE_VERSION=$_NODE_VERSION \
          --build-arg VITE_NAMESPACE="feTEKNOIR_NAMESPACE" \
          --build-arg VITE_APP_BASENAME="/feTEKNOIR_APP_BASENAME/" \
          --build-arg VITE_WS_SERVER="feTEKNOIR_WS_SERVER" \
          --build-arg VITE_HISTORIAN_DB_SERVER="feTEKNOIR_HISTORIAN_DB_SERVER" \
          --build-arg VITE_HISTORIAN_MIDDLE_END_API="feTEKNOIR_HISTORIAN_MIDDLE_END_API" \
          --build-arg VITE_MEDIA_MP4_API="feTEKNOIR_MEDIA_MP4_API" \
          --build-arg VITE_MEDIA_JPEG_API="feTEKNOIR_MEDIA_JPEG_API" \
          --build-arg VITE_MEDIA_JSON_API="feTEKNOIR_MEDIA_JSON_API" \
          --tag us-docker.pkg.dev/teknoir/$_NAMESPACE/sdmc:${safeTag}-${SHORT_SHA}
    waitFor: [ '-' ]

  - id: 'DEPLOYMENT'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    env: 
      - 'SHORT_SHA=${SHORT_SHA}'
      - 'BRANCH_NAME=${BRANCH_NAME}'   
    args: ['tools/_deploy_to_gke.sh']
    waitFor: [ 'BUILD-IMAGE' ]